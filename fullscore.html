// ===== logic (exported for node tests) =====
const L=(function(){
const LET="CDEFGAB",NAT=[0,2,4,5,7,9,11];
const midi=n=>(n.o+1)*12+NAT[n.L]+n.a, step=n=>n.o*7+n.L;
function add(n,st,se){let l=n.L+st,o=n.o+Math.floor(l/7);l=((l%7)+7)%7;return {L:l,o,a:midi(n)+se-((o+1)*12+NAT[l])};}
const ACC={"-2":"𝄫","-1":"♭","0":"","1":"♯","2":"𝄪"};
const name=n=>LET[n.L]+ACC[n.a]+n.o;
function T(s){return {L:LET.indexOf(s[0]),a:s.slice(1)==="#"?1:s.slice(1)==="b"?-1:0,o:3}}
const KEYS=[["C","maj"],["G","maj"],["D","maj"],["A","maj"],["E","maj"],["B","maj"],["F#","maj"],["Db","maj"],["Ab","maj"],["Eb","maj"],["Bb","maj"],["F","maj"],
 ["A","min"],["E","min"],["B","min"],["F#","min"],["C#","min"],["G#","min"],["Eb","min"],["Bb","min"],["F","min"],["C","min"],["G","min"],["D","min"]]
 .map(([t,m])=>({id:t+(m==="maj"?"":"m"),t,m,label:t.replace("#","♯").replace("b","♭")+(m==="maj"?" 大調":" 小調")}));
const BASE=[5,0,2,4,6,1,3]; // fifths for C..B: C0 D2 E4 F-1 G1 A3 B5
const FIF={0:0,1:2,2:4,3:-1,4:1,5:3,6:5};
function fifths(k){const t=T(k.t);return FIF[t.L]+7*t.a-(k.m==="min"?3:0)+(k.m==="mode"?MODES[k.mode].shift:0);}
const SEMI={maj:[0,2,4,5,7,9,11],up:[0,2,3,5,7,9,11],down:[0,2,3,5,7,8,10]};
const deg=(t,d,s)=>add(t,d,Math.floor(d/7)*12+s[d%7]);
const CH=[[[0,0],[2,3],[4,7]],[[0,0],[2,4],[4,7]],[[0,0],[2,4],[5,9]],[[0,0],[3,5],[5,9]],[[0,0],[3,5],[5,8]],
 [[0,0],[1,3],[3,6],[5,9]],[[0,0],[2,4],[4,7],[6,10]]];
// Readability clef rule (hysteresis): alto -> treble at first note >= E5; treble -> alto only at notes <= G4.
// So alto never shows notes above D5 (max 2 ledger lines); A4..D5 stay in whichever clef is current.
function clefs(s){let c="alto";return s.map(n=>{const st=step(n);
  if(c==="alto"&&st>=37)c="treble";else if(c==="treble"&&st<=32)c="alto";return {...n,clef:c};});}
// ===== modal scales (調式音階) =====
const MODES=[["Ionian","伊奧尼亞",0],["Dorian","多利安",-2],["Phrygian","弗里吉亞",-4],["Lydian","利地亞",1],["Mixolydian","混合利地亞",-1],["Aeolian","艾奧利亞",-3],["Locrian","洛克里亞",-5]]
 .map(([en,zh,shift],m)=>({en,zh,shift,semis:[0,1,2,3,4,5,6].map(k=>([0,2,4,5,7,9,11][(k+m)%7]-[0,2,4,5,7,9,11][m]+12)%12)}));
// tonic spelling: the enharmonic whose parent-major key signature has the fewest accidentals (tie: natural letter, then sharps)
function modeTonic(pc,m){const c=[];for(let l=0;l<7;l++)for(const a of[-1,0,1])if(((NAT[l]+a)%12+12)%12===pc)c.push({l,a,f:FIF[l]+7*a+MODES[m].shift});
  c.sort((x,y)=>Math.abs(x.f)-Math.abs(y.f)||Math.abs(x.a)-Math.abs(y.a)||y.f-x.f);const b=c[0];return LET[b.l]+(b.a>0?"#":b.a<0?"b":"");}
MODES.forEach((M,m)=>{for(let pc=0;pc<12;pc++){const t=modeTonic(pc,m);KEYS.push({id:t+"-"+M.en.toLowerCase(),t,m:"mode",mode:m,pc,label:t.replace("#","♯").replace("b","♭")+" "+M.zh+"（"+M.en+"）"});}});
const modeKeyId=(pc,m)=>KEYS.find(k=>k.m==="mode"&&k.pc===+pc&&k.mode===+m).id;
function modeStream(k){const t=T(k.t),sm=MODES[k.mode].semis,span=midi(t)+36<=88?3:2,top=7*span,s=[];   // 3 octaves if the top stays <= E6, else 2
  for(let d=0;d<=top;d++)s.push({...deg(t,d,sm),sec:"調式音階"});for(let d=top-1;d>0;d--)s.push({...deg(t,d,sm),sec:"調式音階"});
  return {stream:clefs(s),final:{...t,clef:"alto",sec:"調式音階・結尾長音"},key:k,span};}
function buildStream(keyId,kind){
  const k=KEYS.find(x=>x.id===keyId)||KEYS[0],t=T(k.t);if(k.m==="mode")return modeStream(k);
  const up=k.m==="maj"?SEMI.maj:SEMI.up,dn=k.m==="maj"?SEMI.maj:SEMI.down,s=[];
  for(let d=0;d<22;d++)s.push({...deg(t,d,up),sec:"音階"});
  for(let d=20;d>0;d--)s.push({...deg(t,d,dn),sec:"音階"});
  if(kind==="scale")return {stream:clefs(s),final:{...t,clef:"alto",sec:"音階・結尾長音"},key:k};
  s.push({...t,sec:"音階"});
  const pn=(a,b)=>name(add(t,a,b)).replace(/\d+$/,""),T0=pn(0,0);
  const CN=[T0+" 小三和弦",T0+" 大三和弦",pn(5,9)+" 小三和弦／"+T0,pn(3,5)+" 大三和弦／"+T0,pn(3,5)+" 小三和弦／"+T0,T0+" 減七和弦",T0+"7 屬七和弦"];let ci=0;
  for(const c of CH){const u=[];for(let o=0;o<3;o++)for(const[a,b]of c)u.push(add(t,a+7*o,b+12*o));u.push(add(t,21,36));
    const d=[];for(let o=2;o>=0;o--)for(const[a,b]of[...c].reverse())d.push(add(t,a+7*o,b+12*o));d.pop();const nm="琶音・"+CN[ci++];s.push(...[...u,...d].map(n=>({...n,sec:nm})));}
  return {stream:clefs(s.filter((n,i)=>i===0||midi(n)!==midi(s[i-1]))),final:{...add(t,3,5),clef:"alto",sec:"琶音・結尾長音"},key:k};
}
function bows(keyId,kind,N){const{stream,final}=buildStream(keyId,kind),b=[];
  for(let i=0;i<stream.length;i+=N)b.push({notes:stream.slice(i,i+N),long:false,start:i});b.push({notes:[final],long:true,start:stream.length});return b;}
function bowDir(i,startUp){return ((i%2===0)!==!!startUp)?"down":"up";}
return {KEYS,MODES,modeKeyId,buildStream,bows,name,step,fifths,midi,bowDir};
})();
if(typeof module!=="undefined")module.exports=L;
// ===== RH (meter / rhythm patterns / accents; pure, node-testable) =====
const RH=(function(){
// ticks: quarter = 48
const PAT={q:{n:"四分音符 ♩",d:[48]},e2:{n:"兩個八分 ♫",d:[24,24]},s4:{n:"四個十六分",d:[12,12,12,12]},tr:{n:"八分三連音",d:[16,16,16]},
 des:{n:"附點八分＋十六分",d:[36,12]},sde:{n:"十六分＋附點八分",d:[12,36]},ess:{n:"八分＋兩個十六分",d:[24,12,12]},sse:{n:"兩個十六分＋八分",d:[12,12,24]},sw:{n:"搖擺（長－短）",d:[32,16]},
 dq:{n:"附點四分 ♩.",d:[72]},e3:{n:"三個八分",d:[24,24,24]},qe:{n:"四分＋八分",d:[48,24]},eq:{n:"八分＋四分",d:[24,48]},s6:{n:"六個十六分",d:[12,12,12,12,12,12]},esse:{n:"八分＋兩個十六分＋八分",d:[24,12,12,24]}};
const METERS={"2/4":{pulse:48,unit:48,un:"♩",gr:[[1,1]]},"3/4":{pulse:48,unit:48,un:"♩",gr:[[1,1,1]]},"4/4":{pulse:48,unit:48,un:"♩",gr:[[1,1,1,1]]},
 "5/8":{pulse:24,unit:24,un:"♪",gr:[[2,3],[3,2]]},"6/8":{pulse:24,unit:72,un:"♩.",gr:[[3,3]]},"7/8":{pulse:24,unit:24,un:"♪",gr:[[2,2,3],[3,2,2],[2,3,2]]}};
const plen=id=>PAT[id].d.reduce((a,b)=>a+b,0);
const grp=cfg=>{const m=METERS[cfg.meter];return m.gr[cfg.grouping|0]||m.gr[0];};
const groups=cfg=>grp(cfg).map(p=>p*METERS[cfg.meter].pulse);
const pulses=cfg=>grp(cfg).reduce((a,b)=>a+b,0);
function defaultAccents(cfg){const m=METERS[cfg.meter],g=grp(cfg),a=[];
  if(m.pulse===48)g.forEach((_,k)=>a.push(k===0?2:(g.length===4&&k===2)?1:0));else g.forEach((p,k)=>{for(let j=0;j<p;j++)a.push(j===0?(k===0?2:1):0);});return a;}

// ===== full-score intonation report =====
// window.__intonation = {cycle:n, cents:[...]} indexed by stream note (null = not detected); final long note last.
let TOL=10;const COL=c=>PD.color(PD.classify(c,TOL));
function reportLine(notes,fif,sp,maxW){const top=4*sp,H=top+4*sp+4*sp,Y=p=>top+(8-p)*sp/2,BOT={alto:24,treble:30};
  const SH=[38,35,39,36,33,37,34],FL=[34,37,33,36,32,35,31],SO=[3,0,4,1,5,2,6],FO=[6,2,5,1,4,0,3];
  const keyAlt=l=>fif>0&&SO.slice(0,fif).includes(l)?1:fif<0&&FO.slice(0,-fif).includes(l)?-1:0;
  const AG={"-2":"ff","-1":"f","0":"n","1":"s","2":"ss"};
  let clef=notes[0].n.clef||"alto",x=4,g="";const cg=c=>c==="treble"?["g",2]:["c",4];
  {const[k,p]=cg(clef);g+=G(k,x,Y(p),sp);x+=3*sp;}
  (fif>0?SH:FL).slice(0,Math.abs(fif)).forEach(st=>{g+=G(fif>0?"s":"f",x,Y(st-(clef==="treble"?0:7)-BOT[clef]),sp);x+=1.05*sp;});x+=0.6*sp;
  let st={},lastBow=notes[0].bow,bars="";
  notes.forEach(o=>{const nn=o.n,c=nn.clef||"alto";
    if(o.bow!==lastBow&&!o.barStart){bars+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+4*sp}" stroke="#bbb" stroke-dasharray="2,2"/>`;x+=0.5*sp;lastBow=o.bow;}
    if(o.bow!==lastBow)lastBow=o.bow;
    if(o.barStart){bars+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+4*sp}" stroke="#222" stroke-width="1.3"/>`;x+=0.6*sp;st={};}
    if(c!==clef){clef=c;const[k,p]=cg(c);g+=G(k,x,Y(p),sp*0.7);x+=2.1*sp;}
    const p=L.step(nn)-BOT[clef],y=Y(p),exp=st[L.step(nn)]??keyAlt(nn.L);
    if(nn.a!==exp){g+=G(AG[nn.a],x,y,sp);st[L.step(nn)]=nn.a;}const xa=x+1.3*sp;
    for(let q=-2;q>=p;q-=2)g+=`<line x1="${xa-3}" x2="${xa+sp*1.2+3}" y1="${Y(q)}" y2="${Y(q)}" stroke="#222"/>`;
    for(let q=10;q<=p;q+=2)g+=`<line x1="${xa-3}" x2="${xa+sp*1.2+3}" y1="${Y(q)}" y2="${Y(q)}" stroke="#222"/>`;
    const col=COL(o.c),lbl=o.c==null?"未偵測":(o.c>0?"+":"")+o.c+" 音分";
    g+=`<g fill="${col}" class="rn" data-t="${L.name(nn)}：${lbl}">${G(o.long?"nh":"nb",xa,y,sp)}<rect x="${xa-2}" y="${y-sp}" width="${sp*1.6}" height="${2*sp}" fill="transparent"/></g>`;
    x+=2.6*sp;});
  const W=x+4;let out=`<svg viewBox="0 0 ${W} ${H}" style="width:${Math.min(100,W/maxW*100).toFixed(2)}%" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<5;i++)out+=`<line x1="2" x2="${W-2}" y1="${top+i*sp}" y2="${top+i*sp}" stroke="#222" stroke-width="1"/>`;
  return out+bars+`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+4*sp}" stroke="#222" stroke-width="1.3"/><g fill="#111">${g}</g></svg>`;}
function renderReport(){const R=window.__intonation;if(!R)return;const keyId=R.key||document.getElementById("key").value,kind=R.kind||document.getElementById("src").value;
  const N=R.N||+document.getElementById("n").value,bw=L.bows(keyId,kind,N),fif=L.fifths(L.KEYS.find(k=>k.id===keyId));
  const all=[];let idx=0;const{stream}=L.buildStream(keyId,kind);
  bw.forEach((b,bi)=>b.notes.forEach(n=>{const i=idx++;const prev=i>0?(stream[i-1]||null):null;
    const sec=n.sec||"",mid=b.long?"final":sec.includes("音階")?"s"+Math.min(3,Math.floor(i/12)):sec;
    all.push({n,idx:i,bow:bi,long:b.long,c:R.cents[i]??null,mid});}));
  const segs=R.segs&&R.segs.length?R.segs:null,groups=segs?segs.map(([a,b])=>all.filter(o=>o.idx>=a&&o.idx<=b)):[all];all.splice(0,all.length,...groups.flat());
  const perLine=window.innerWidth<600?14:26,sp=10,maxW=perLine*2.6*sp+12*sp;let html="";window.__reportLines=[];
  groups.forEach((grp,gi)=>{const meas=[];grp.forEach((o,k)=>{if(!k||o.mid!==grp[k-1].mid||o.idx!==grp[k-1].idx+1)meas.push([]);meas.at(-1).push(o);});
    // pack whole Flesch measures into lines; never split a measure. An over-wide measure gets its own line (scaled down via the SVG viewBox).
    const lines=[];let cur=[];meas.forEach(m=>{if(cur.length&&cur.length+m.length>perLine){lines.push(cur);cur=[];}
      m.forEach((o,j)=>o.barStart=j===0&&cur.length>0);cur.push(...m);if(cur.length>=perLine){lines.push(cur);cur=[];}});if(cur.length)lines.push(cur);
    window.__reportLines.push(...lines.map(l=>l.map(o=>o.mid)));
    if(segs){const ok=grp.filter(o=>o.c!=null&&Math.abs(o.c)<=TOL).length;html+=`<div class="seglbl">第 ${gi+1} 段：第 ${segs[gi][0]+1}–${segs[gi][1]+1} 音（${grp.length} 音，準 ${ok}）</div>`;}
    html+=lines.map(l=>reportLine(l,fif,sp,maxW)).join("");});
  document.getElementById("rscore").innerHTML=html;
  const cnt={ok:0,hi:0,lo:0,nd:0};all.forEach(o=>o.c==null?cnt.nd++:Math.abs(o.c)<=TOL?cnt.ok++:o.c>0?cnt.hi++:cnt.lo++);
  document.getElementById("rtitle").textContent=`練習報告・第 ${R.cycle||1} 輪${R.partial?"（部分）":""}（${L.KEYS.find(k=>k.id===keyId).label}，每弓 ${N} 音${R.rh?`，${R.rh}`:""}${segs?`，${segs.length} 段`:""}）`;
  document.getElementById("rstats").textContent=`共 ${all.length} 音：準 ${cnt.ok}・偏高 ${cnt.hi}・偏低 ${cnt.lo}・未偵測 ${cnt.nd}（容許 ±${TOL} 音分）`;
  const pr=PD.problems(all.map(o=>o.n),all.map(o=>o.c),L.name,TOL);
  document.getElementById("rprob").innerHTML=pr.length?pr.map(p=>`<li><b>${p.note}</b>：平均 ${p.avg>0?"+":""}${p.avg.toFixed(1)} 音分（${p.avg>0?"偏高":"偏低"}，${p.n} 次）</li>`).join(""):"<li style='color:#999'>沒有明顯的問題音</li>";
  if(typeof renderHist==="function")renderHist();}

(function(){const q=new URLSearchParams(location.search);if(q.get("mock")){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const{stream}=L.buildStream(document.getElementById("key").value,document.getElementById("src").value);
  const cents=[...stream,0].map(()=>{const r=rnd();return r<0.08?null:Math.round((rnd()-0.5)*44);});
  window.renderIntonationReport({cycle:3,cents});document.body.dataset.lines=JSON.stringify(window.__reportLines);}})();
